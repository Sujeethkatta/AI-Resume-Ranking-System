<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Resume Screening & Ranking System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="hero-wrapper">

    <!-- HEADER -->
    <div class="hero-header">
        <h1>🚀 AI Resume Screening & Ranking System</h1>
        <p>Smart Candidate Shortlisting powered by NLP & Machine Learning</p>
    </div>

    <!-- FORM CARD -->
    <div class="hero-card">
        <form method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label>📄 Job Description</label>
                <textarea name="job_description"
                          placeholder="Paste the job description here..."
                          required></textarea>
            </div>

            <div class="form-group">
                <label>📎 Upload Resumes (PDF only)</label>
                <input type="file" name="resumes" multiple required>
            </div>

            <button type="submit" class="hero-btn">
                Analyze & Rank Candidates
            </button>

        </form>
    </div>

</div>

</body>
</html>
